<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Genz Fashion | Streetwear</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f7f7f7;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #111, #333);
      color: white;
    }

    .hero h1 {
      font-size: clamp(45px, 10vw, 90px);
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 30px;
      color: #ddd;
    }

    .btn {
      display: inline-block;
      background: white;
      color: #111;
      padding: 14px 28px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
    }

    section {
      padding: 60px 7%;
    }

    .title {
      text-align: center;
      font-size: 35px;
      margin-bottom: 40px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
    }

    .product {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      text-align: center;
      padding-bottom: 20px;
    }

    .product-img {
      height: 280px;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
    }

    .product h3 {
      margin: 18px 0 8px;
    }

    .price {
      font-weight: bold;
      margin-bottom: 15px;
    }

    .buy {
      background: #111;
      color: white;
      padding: 11px 22px;
      border-radius: 25px;
      text-decoration: none;
      display: inline-block;
    }

    .about {
      text-align: center;
      max-width: 700px;
      margin: auto;
      line-height: 1.7;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 30px;
    }

    @media(max-width:600px) {
      nav a {
        margin-left: 8px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">GENZ FASHION</div>

  <nav>
    <a href="#home">Home</a>
    <a href="#shop">Shop</a>
    <a href="#about">About</a>
  </nav>
</header>


<section class="hero" id="home">
  <div>
    <h1>WEAR YOUR VIBE.</h1>
    <p>Trendy streetwear made for the new generation.</p>
    <a href="#shop" class="btn">SHOP NOW →</a>
  </div>
</section>


<section id="shop">

  <h2 class="title">🔥 TRENDING DROPS</h2>

  <div class="products
